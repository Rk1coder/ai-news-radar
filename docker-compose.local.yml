# Selected through COMPOSE_FILE in .env by scripts/setup_local_db.py.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ainews
      POSTGRES_DB: ainews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local_db.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Database has no published port; only the private Compose network can reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainews -d ainews"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    environment:
      PYTHONUNBUFFERED: "1"

  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ainews
      PGDATABASE: ainews
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local_db.py first}
    entrypoint: ["/bin/sh", "/opt/ai-news/backup-loop.sh"]
    volumes:
      - ./deploy/postgres/backup-loop.sh:/opt/ai-news/backup-loop.sh:ro
      - postgres-backups:/backups
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  postgres-backups:
