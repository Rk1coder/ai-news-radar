services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-claude-haiku-4-5}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_SECURITY: ${EMAIL_SMTP_SECURITY:-starttls}
      EMAIL_PUBLIC_URL: ${EMAIL_PUBLIC_URL:-}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_RECIPIENTS: ${EMAIL_RECIPIENTS:-}
      EMAIL_SEND_HOUR: ${EMAIL_SEND_HOUR:-16}
      AUTO_SCAN_ENABLED: ${AUTO_SCAN_ENABLED:-true}
      SCAN_TIMEZONE: ${SCAN_TIMEZONE:-Europe/Istanbul}
      SCAN_HOURS: ${SCAN_HOURS:-6,10,14,18,22}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-15}
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/api/scan-status', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12

  scheduler:
    build: .
    command: ["python", "-m", "ai_news_radar.scheduler"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-claude-haiku-4-5}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_SECURITY: ${EMAIL_SMTP_SECURITY:-starttls}
      EMAIL_PUBLIC_URL: ${EMAIL_PUBLIC_URL:-}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_RECIPIENTS: ${EMAIL_RECIPIENTS:-}
      EMAIL_SEND_HOUR: ${EMAIL_SEND_HOUR:-16}
      AUTO_SCAN_ENABLED: ${AUTO_SCAN_ENABLED:-true}
      SCAN_TIMEZONE: ${SCAN_TIMEZONE:-Europe/Istanbul}
      SCAN_HOURS: ${SCAN_HOURS:-6,10,14,18,22}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-15}
    depends_on:
      api:
        condition: service_healthy

  hydroxide:
    profiles: [proton]
    build: ./deploy/hydroxide
    restart: unless-stopped
    volumes:
      - hydroxide-auth:/data
    # No host port: SMTP is reachable only inside the Compose network.
    expose: ["1025"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api.:8008
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  hydroxide-auth:
