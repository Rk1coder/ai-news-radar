[project]
name = "ai-news-radar"
version = "0.1.0"
description = "Tarama -> dogrulama -> siniflandirma pipeline'i ile AI/teknoloji gelismelerini izleyen sistem"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12,<5",
    "Pillow>=13,<14",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_news_radar = ["assets/*.png"]
